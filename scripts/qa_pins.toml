# Pins for the QA planning code. Stdlib-only tooling reads this file: scripts/qa_pins.py.
#
# A commit pin is temporary (temp_pin = true): it names the exact revision the code was built against until a release tag
# exists. Once a tag exists, `python scripts/qa_pins.py rewrite` moves every declaration to the tag and sets temp_pin to
# false. Nothing here creates a tag or a release. See docs/qa_planning.md.

