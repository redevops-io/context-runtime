name: tests
# The unit tests: offline, no model calls, no API keys. Installs the `test` extra so nothing is skipped for a missing optional dependency.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # Extras: dev (pytest, ruff), test (pytest, numpy, httpx), control-plane (fastapi/httpx for test_control_plane/test_mcp),
        # duckdb (duckdb + sqlglot for the analytical retriever); numpy+pillow for the multimodal/multivector tests.
        # NOT installed (tests that need them are not run or skip): litellm, graphiti/hipporag,
        # redevops-rag and runtime-contracts (git extras), boto3, dagster, GPU/OCR/ASR stacks.
        run: python -m pip install -e ".[dev,test,control-plane,duckdb]" numpy pillow
      - name: Test
        # Tests needing a live service are guarded by skipif on credential env vars, which are intentionally never set in CI.
        # No docker/GPU tests are collected.
        run: python -m pytest tests -q -rs

  # Native-OS lanes. These run the same suite and the same install recipe as the Ubuntu job on GitHub-hosted
  # Windows and macOS (Apple Silicon) runners. They are separate jobs with their own check names so the
  # Ubuntu `pytest` check is untouched; they are not required checks (yet). No secrets are used.
  pytest-windows:
    name: "pytest (windows-latest, native, non-required)"
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Surface any text-mode open()/read_text() that relies on the locale code page.
      PYTHONWARNINGS: "default"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,test,control-plane,duckdb]" numpy pillow
      - name: Test
        run: python -X warn_default_encoding -m pytest tests -q -rs

  pytest-macos:
    name: "pytest (macos-14, Apple Silicon, native, non-required)"
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,test,control-plane,duckdb]" numpy pillow
      - name: Test
        run: python -X warn_default_encoding -m pytest tests -q -rs
