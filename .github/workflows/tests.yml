name: tests
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # Offline subset only. Extras: dev (pytest), control-plane (fastapi/httpx for
        # test_control_plane/test_mcp), duckdb; numpy+pillow for the multimodal/multivector tests.
        # NOT installed (tests that need them are not run or skip): litellm, graphiti/hipporag,
        # redevops-rag and runtime-contracts (git extras), boto3, dagster, GPU/OCR/ASR stacks.
        run: python -m pip install -e ".[dev,control-plane,duckdb]" numpy pillow
      - name: Test
        # Verified locally with network disabled (unshare -rn) and no credentials: 556 passed,
        # 12 skipped. Tests needing a live service are guarded by skipif on credential env vars
        # (e.g. test_hubspot_crm::test_live_search_smoke, test_salesforce_crm::test_live_query_smoke),
        # which are intentionally never set in CI. No docker/GPU tests are collected.
        run: pytest -q
