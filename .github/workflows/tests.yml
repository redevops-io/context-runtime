name: tests
# The unit tests: offline, no model calls, no API keys. Installs the `test` extra so nothing is skipped for a missing optional dependency.
on:
  pull_request:
  push:
    branches: ["v4"]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest tests -q -rs
