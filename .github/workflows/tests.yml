name: tests
# The unit tests: offline, no model calls, no API keys. Installs the `test` extra so nothing is skipped for a missing optional dependency.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # Extras: dev (pytest, ruff), test (pytest, numpy, httpx), control-plane (fastapi/httpx for test_control_plane/test_mcp),
        # duckdb (duckdb + sqlglot for the analytical retriever); numpy+pillow for the multimodal/multivector tests.
        # NOT installed (tests that need them are not run or skip): litellm, graphiti/hipporag,
        # redevops-rag and runtime-contracts (git extras), boto3, dagster, GPU/OCR/ASR stacks.
        run: python -m pip install -e ".[dev,test,control-plane,duckdb]" numpy pillow
      - name: Test
        # Tests needing a live service are guarded by skipif on credential env vars, which are intentionally never set in CI.
        # No docker/GPU tests are collected.
        run: python -m pytest tests -q -rs
